name: Publish APK
on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MathHeroes-APK
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls *.apk | head -n1)
          cp "$APK" MathHeroes.apk
          gh release create "apk-${{ github.event.workflow_run.run_number }}" MathHeroes.apk --repo "${{ github.repository }}" --title "MathHeroes build ${{ github.event.workflow_run.run_number }}" --notes "Debug APK built from commit ${{ github.event.workflow_run.head_sha }}"
