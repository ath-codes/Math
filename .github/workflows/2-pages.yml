name: Deploy web
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | sort -V | tail -n1)
          mkdir -p work && unzip -q "$ZIP" -d work
          D=work
          if [ ! -f "$D/settings.gradle.kts" ]; then D="work/$(ls work | head -n1)"; fi
          mkdir -p _site && cp -r "$D/app/src/main/assets/." _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
