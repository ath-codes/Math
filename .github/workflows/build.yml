name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n1)
          mkdir -p work && unzip -q "$ZIP" -d work
          D=work
          if [ ! -f "$D/settings.gradle.kts" ]; then D="work/$(ls work | head -n1)"; fi
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MathHeroes-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
